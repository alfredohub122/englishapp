name: BrowseIt Android Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: browseit-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BrowseIt APK
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: false

      - name: Detect Flutter project directory
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "pubspec.yaml" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [[ -f "looply/pubspec.yaml" ]]; then
            echo "PROJECT_DIR=looply" >> "$GITHUB_ENV"
          else
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

      - name: Verify Android Gradle configuration
        shell: bash
        run: |
          set -euo pipefail

          WRAPPER="$PROJECT_DIR/android/gradle/wrapper/gradle-wrapper.properties"
          GRADLEW="$PROJECT_DIR/android/gradlew"
          SETTINGS="$PROJECT_DIR/android/settings.gradle"
          GRADLE_PROPERTIES="$PROJECT_DIR/android/gradle.properties"
          APP_GRADLE="$PROJECT_DIR/android/app/build.gradle"

          test -f "$WRAPPER"
          test -f "$GRADLEW"
          test -f "$SETTINGS"
          test -f "$GRADLE_PROPERTIES"
          test -f "$APP_GRADLE"

          grep -qF 'gradle-9.5.0-bin.zip' "$WRAPPER" || {
            echo "ERROR: The project must use Gradle 9.5.0."
            exit 1
          }
          grep -qF 'VERSION="9.5.0"' "$GRADLEW" || {
            echo "ERROR: The Gradle wrapper script is not synchronized with Gradle 9.5.0."
            exit 1
          }
          grep -qF 'id "com.android.application" version "9.3.2" apply false' "$SETTINGS" || {
            echo "ERROR: Android Gradle Plugin 9.3.2 is not configured."
            exit 1
          }
          grep -qF 'android.builtInKotlin=true' "$GRADLE_PROPERTIES" || {
            echo "ERROR: AGP built-in Kotlin is not enabled."
            exit 1
          }
          if grep -Eq 'org\.jetbrains\.kotlin\.android|kotlin-android' "$SETTINGS" "$APP_GRADLE"; then
            echo "ERROR: Remove the legacy Kotlin Gradle plugin when using AGP 9 built-in Kotlin."
            exit 1
          fi

          echo "Android Gradle configuration verified (AGP 9.3.2 / Gradle 9.5.0 / built-in Kotlin)."

      - name: Display build environment
        run: |
          flutter --version
          java -version

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          flutter pub get

      # On the first run, BROWSEIT_SECRETS_TOKEN is required so this workflow
      # can save the generated signing key as encrypted repository Actions secrets.
      # Later runs restore the same keystore from BROWSEIT_KEYSTORE_BASE64.
      - name: Restore or generate persistent BrowseIt release keystore
        id: signing
        shell: bash
        env:
          BROWSEIT_KEYSTORE_BASE64: ${{ secrets.BROWSEIT_KEYSTORE_BASE64 }}
          BROWSEIT_STORE_PASSWORD: ${{ secrets.BROWSEIT_STORE_PASSWORD }}
          BROWSEIT_KEY_PASSWORD: ${{ secrets.BROWSEIT_KEY_PASSWORD }}
          BROWSEIT_SECRETS_TOKEN: ${{ (github.event_name != 'pull_request') && secrets.BROWSEIT_SECRETS_TOKEN || '' }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$GITHUB_WORKSPACE/$PROJECT_DIR/android/app/browseit-release.keystore"
          mkdir -p "$(dirname "$KEYSTORE_PATH")"

          if [[ -n "$BROWSEIT_KEYSTORE_BASE64" ]]; then
            echo "Existing BrowseIt release keystore found in GitHub Secrets. Restoring it..."

            : "${BROWSEIT_STORE_PASSWORD:?BROWSEIT_STORE_PASSWORD is missing from GitHub Secrets}"
            : "${BROWSEIT_KEY_PASSWORD:?BROWSEIT_KEY_PASSWORD is missing from GitHub Secrets}"

            STORE_PASSWORD="$BROWSEIT_STORE_PASSWORD"
            KEY_PASSWORD="$BROWSEIT_KEY_PASSWORD"

            printf '%s' "$BROWSEIT_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
          else
            echo "No BrowseIt keystore found. Generating the release signing key for the first time..."

            : "${BROWSEIT_SECRETS_TOKEN:?First setup requires the BROWSEIT_SECRETS_TOKEN repository secret. Create a fine-grained PAT with Actions secrets: Read and write, then add it under Settings > Secrets and variables > Actions.}"

            # Requested credentials. The workflow saves them as encrypted GitHub Secrets.
            STORE_PASSWORD='@browseit00'
            KEY_PASSWORD='@browseit00'
            KEY_ALIAS='browseit'

            keytool -genkeypair -v \
              -storetype JKS \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10958 \
              -dname "CN=BrowseIt, OU=Android, O=BrowseIt, L=Luanda, ST=Luanda, C=AO"

            chmod 600 "$KEYSTORE_PATH"
            KEYSTORE_BASE64="$(base64 -w 0 "$KEYSTORE_PATH")"

            # GitHub-hosted Ubuntu runners include the GitHub CLI (gh).
            # Save passwords first and the keystore last, so the keystore secret
            # acts as the marker that initial signing-key setup is complete.
            GH_TOKEN="$BROWSEIT_SECRETS_TOKEN" gh secret set BROWSEIT_STORE_PASSWORD \
              --repo "$GITHUB_REPOSITORY" --body "$STORE_PASSWORD"
            GH_TOKEN="$BROWSEIT_SECRETS_TOKEN" gh secret set BROWSEIT_KEY_PASSWORD \
              --repo "$GITHUB_REPOSITORY" --body "$KEY_PASSWORD"
            GH_TOKEN="$BROWSEIT_SECRETS_TOKEN" gh secret set BROWSEIT_KEYSTORE_BASE64 \
              --repo "$GITHUB_REPOSITORY" --body "$KEYSTORE_BASE64"

            echo "Persistent BrowseIt signing keystore saved to GitHub Actions Secrets."
          fi

          # Validate that the keystore opens and contains the expected alias.
          KEY_INFO="$(keytool -list -v \
            -storetype JKS \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$STORE_PASSWORD" \
            -alias browseit)"

          ACTUAL_SHA1="$(printf '%s\n' "$KEY_INFO" | awk -F': ' '/SHA1:/{gsub(/[[:space:]]/, "", $2); print toupper($2); exit}')"
          if [[ -z "$ACTUAL_SHA1" ]]; then
            echo "ERROR: Could not read the BrowseIt keystore SHA-1 fingerprint."
            exit 1
          fi

          echo "BrowseIt signing keystore validated."
          echo "Certificate SHA-1: $ACTUAL_SHA1"
          echo "Certificate validity: 30 years (10958 days) for newly generated keys."

          # Mask credentials in subsequent workflow logs and pass them to build steps.
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

          {
            echo "BROWSEIT_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "BROWSEIT_STORE_PASSWORD=$STORE_PASSWORD"
            echo "BROWSEIT_KEY_PASSWORD=$KEY_PASSWORD"
            echo "BROWSEIT_KEY_ALIAS=browseit"
          } >> "$GITHUB_ENV"

      - name: Build BrowseIt APK
        shell: bash
        env:
          BROWSEIT_GOOGLE_WEB_CLIENT_ID: ${{ secrets.BROWSEIT_GOOGLE_WEB_CLIENT_ID }}
          BROWSEIT_WORKER_URL: ${{ vars.BROWSEIT_WORKER_URL }}
        run: |
          set -euo pipefail

          : "${BROWSEIT_GOOGLE_WEB_CLIENT_ID:?Missing GitHub Actions secret BROWSEIT_GOOGLE_WEB_CLIENT_ID}"
          if [[ -n "$BROWSEIT_WORKER_URL" && "$BROWSEIT_WORKER_URL" != https://* ]]; then
            echo "ERROR: BROWSEIT_WORKER_URL must start with https://"
            exit 1
          fi
          if [[ -z "$BROWSEIT_WORKER_URL" ]]; then
            echo "::warning::BROWSEIT_WORKER_URL is not configured; cloud backup remains disabled."
          fi

          cd "$PROJECT_DIR"

          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$BROWSEIT_GOOGLE_WEB_CLIENT_ID" \
            --dart-define=BROWSEIT_WORKER_URL="$BROWSEIT_WORKER_URL" \
            -PBROWSEIT_GOOGLE_WEB_CLIENT_ID="$BROWSEIT_GOOGLE_WEB_CLIENT_ID"

          APK_DIR="build/app/outputs/flutter-apk"
          shopt -s nullglob
          APKS=("$APK_DIR"/app-*-release.apk)

          if [[ ${#APKS[@]} -eq 0 ]]; then
            echo "ERROR: No BrowseIt APKs were generated."
            exit 1
          fi

          echo "BrowseIt APKs successfully generated:"
          ls -lh "${APKS[@]}"

      - name: Remove temporary keystore from runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${PROJECT_DIR:-.}"
          rm -f "$GITHUB_WORKSPACE/$PROJECT_DIR/android/app/browseit-release.keystore"

      - name: Rename APKs with run number
        id: rename
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk"
          OUT_DIR="$PROJECT_DIR/build/app/outputs/flutter-apk/release-assets"
          mkdir -p "$OUT_DIR"

          for apk in "$APK_DIR"/app-*-release.apk; do
            [[ -f "$apk" ]] || continue
            name="$(basename "$apk")"
            arch="$(echo "$name" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            new_name="browseit-${arch}-build${{ github.run_number }}.apk"
            cp "$apk" "$OUT_DIR/$new_name"
          done

          if ! compgen -G "$OUT_DIR/*.apk" > /dev/null; then
            echo "ERROR: No renamed APK assets were found."
            exit 1
          fi

          echo "asset_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "Assets ready for release:"
          ls -lh "$OUT_DIR"

      - name: Publish release with APK assets
        id: release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: "BrowseIt build #${{ github.run_number }}"
          body: |
            Build automático do commit ${{ github.sha }} (branch `${{ github.ref_name }}`).

            Escolhe o APK pela arquitetura do teu telemóvel:
            - `arm64-v8a` — recomendado para a maioria dos Android modernos.
            - `armeabi-v7a` — para aparelhos Android de 32-bit.
            - `x86_64` — para emuladores/Chromebooks Intel.

            Assinatura Android mantida através de GitHub Actions Secrets.
          files: ${{ steps.rename.outputs.asset_dir }}/*.apk
          fail_on_unmatched_files: true
          make_latest: true

      - name: Write download links to summary
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          echo "## BrowseIt APKs disponíveis para download" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Arquitetura | Link direto |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          for apk in "$PROJECT_DIR"/build/app/outputs/flutter-apk/release-assets/*.apk; do
            [[ -f "$apk" ]] || continue
            name="$(basename "$apk")"
            url="https://github.com/${{ github.repository }}/releases/download/latest-build/${name}"
            echo "| $name | [Baixar]($url) |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name -> $url"
          done
